server {
    listen 80;
    listen [::]:80;

    server_name andrzejpietka.pl www.andrzejpietka.pl;

    root /var/www/portfolio/strona;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # CV do pobrania: plik wgrywany ręcznie (nie ma go w repozytorium), bez indeksowania w Google
    location = /CV-Andrzej-Pietka.pdf {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Content-Disposition 'attachment; filename="CV-Andrzej-Pietka.pdf"';
        add_header Cache-Control "no-cache";
    }

    location /zdjecia/ {
        alias /var/www/portfolio/zdjecia/;
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/portfolio-access.log;
    error_log /var/log/nginx/portfolio-error.log;
}